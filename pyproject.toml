[project]
name = "slidegen"
version = "0.1.0"
description = "Turn a brief into structured, editable, on-brand PowerPoint slides."
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=0.6.23",
    "openai>=1.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
slidegen = "slidegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["error::DeprecationWarning:slidegen.*"]
